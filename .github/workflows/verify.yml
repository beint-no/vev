name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install PostgreSQL 18 on Linux
        if: runner.os == 'Linux'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo install -m 644 /tmp/pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-contrib-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - name: Install PostgreSQL 18 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
      - name: Verify toolchains
        run: |
          java -version
          postgres --version
      - name: Correctness, independent consumers, Gradle integration, and release artifacts
        run: ./gradlew clean check releaseBundle :benchmarks:jmhClasses --console=plain
      - name: Verify the actual release repository with Kotlin and Java
        run: python3 scripts/verify-release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: correctness-${{ runner.os }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            build/distributions/*.zip
          retention-days: 1
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo install -m 644 /tmp/pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-contrib-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - name: Measure schema bootstrap, SQL generation, and Kotlin compilation
        run: ./gradlew :benchmarks:buildPerformance --console=plain
      - name: JDBC, Hibernate projections and entity writes with allocation profiling
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ]; then
            ./gradlew :benchmarks:jmh --console=plain
          else
            ./gradlew :benchmarks:jmh -PbenchmarkQuick=true --console=plain
          fi
      - name: Check gross regressions and retain machine-readable evidence
        run: python3 scripts/check-performance.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance-linux
          path: |
            benchmarks/build/results/jmh/**
            benchmarks/build/reports/build-performance.json
          retention-days: 1
